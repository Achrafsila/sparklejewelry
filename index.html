<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparkle — Back-office</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#26251f;font:15px system-ui,sans-serif}aside{background:#212820;color:#fff;padding:28px;min-height:100vh;position:fixed;width:235px}strong.brand{font:32px Georgia;display:block;margin-bottom:32px}nav{display:grid;gap:8px}button,input,select{font:inherit} input,select{color:#26251f;caret-color:#26251f;color-scheme:light;-webkit-text-fill-color:currentColor} input::placeholder{color:#68675d;opacity:1} input::file-selector-button,select option{color:#26251f;background:#f8f6f2}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#eae8df;color:#26251f}nav button{text-align:left;background:transparent;color:white}nav button.active,.primary{background:#315b45;color:white}main{margin-left:235px;padding:45px clamp(20px,5vw,75px);max-width:1400px}h1{font:42px Georgia;margin:0 0 14px}h2{font:26px Georgia}p{line-height:1.55}.muted{color:#68675d}section,form{background:white;border:1px solid #e8e3d8;border-radius:14px;padding:20px;margin:18px 0}.grid,.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.grid>*{flex:1;min-width:150px}label{display:grid;gap:5px;font-size:13px}input,select{min-width:0;width:100%;border:1px solid #d8d3c8;border-radius:7px;padding:9px;background:white}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:11px 8px;border-bottom:1px solid #eee9de}th{font-size:12px;color:#68675d}.scroll{overflow:auto}.alert{color:#86551d;background:#fff3dd;padding:10px;border-radius:8px}.thumb{width:42px;height:42px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-right:8px}.notice{min-height:24px;color:#315b45}.error{color:#a32727}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eeeee5;font-size:12px}.line{padding:10px 0;border-bottom:1px solid #eee9de}small{display:block;margin-top:6px}@media(max-width:720px){aside{position:static;width:auto;min-height:0;padding:15px}strong.brand{margin-bottom:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:22px 14px}h1{font-size:34px}section,form{padding:14px}}
.arrival-layout{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}.arrival-layout form{margin:0;min-width:0}.arrival-layout h3{margin:0 0 16px}.arrival-layout fieldset{margin:16px 0;border:1px solid #e8e3d8;border-radius:8px;min-width:0}.arrival-layout input[type=file]{font-size:13px}@media(max-width:900px){.arrival-layout{grid-template-columns:1fr}}
</style>
<aside><strong class="brand">Sparkle</strong><nav aria-label="Navigation"></nav></aside>
<main><div id="notice" class="notice" role="status"></div><div id="view"></div></main>
<script>
'use strict';
const key = 'sparkle-back-office-v1';
const initial = {variants:[],offers:[],orders:[],receipts:[]};
let data = JSON.parse(localStorage.getItem(key) || JSON.stringify(initial));
let page = 'Stock';
let receipt = [];
let cart = [];
let editing = null;
const view = document.querySelector('#view');
const nav = document.querySelector('nav');
const notice = document.querySelector('#notice');
const pages = ['Stock','Offres','Commandes','Préparation','Suivi','Pilotage'];
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e = escapeHtml;
const money = cents => new Intl.NumberFormat('fr-MA',{style:'currency',currency:'MAD'}).format(cents/100);
const cents = value => Math.round(Number(value)*100);
const date = () => new Date().toISOString();
const id = () => globalThis.crypto?.randomUUID?.() || String(Date.now()) + Math.random();
const bySku = sku => data.variants.find(v => v.sku === sku);
const name = sku => {const v = bySku(sku);return v ? [v.model,v.variant].filter(Boolean).join(' · ') : sku;};
const needs = items => items.reduce((totals,item) => { totals[item.sku]=(totals[item.sku] || 0)+item.qty; return totals; },Object.create(null));
const reserved = sku => data.orders.filter(o=>['À préparer','Préparée'].includes(o.status)).reduce((n,o)=>n+(needs(o.lines.flatMap(l=>l.items))[sku]||0),0);
const available = sku => bySku(sku).physical-reserved(sku);
const required = (label,field,props='') => `<label>${label}<input name="${field}" required ${props}></label>`;
const amount = (label,field,props='') => required(label,field,`type="number" min="0" step="0.01" ${props}`);
const options = (items,selected) => items.map(([value,label])=>`<option value="${e(value)}" ${value===selected?'selected':''}>${e(label)}</option>`).join('');
const skuOptions = () => options(data.variants.map(v=>[v.sku,name(v.sku)]));
const selectable = (label,field,choices) => `<label>${label}<select name="${field}" required>${choices}</select></label>`;
const button = (label,action,value='',primary=false) => `<button type="button" data-action="${action}" data-value="${e(value)}" class="${primary?'primary':''}">${label}</button>`;
function table(headers, rows, empty) {
  return rows.length ? `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<p class="muted">${empty}</p>`;
}
function message(text,error=false){notice.textContent=text;notice.classList.toggle('error',error);}
function save(change, text){
  const before=structuredClone(data);
  const lowBefore=new Set(data.variants.filter(v=>available(v.sku)<=5).map(v=>v.sku));
  try {change();localStorage.setItem(key,JSON.stringify(data));}
  catch(error){data=before;throw error;}
  const newlyLow=data.variants.filter(v=>available(v.sku)<=5&&!lowBefore.has(v.sku));
  render();
  message([text,...newlyLow.map(v=>`Stock bas · ${name(v.sku)} · ${available(v.sku)} disponible(s)`)].filter(Boolean).join(' · '));
}
function stock(){
  const low=data.variants.filter(v=>available(v.sku)<=5);
  return `<h1>Stock</h1><p class="muted">Arrivages et disponibilités par référence.</p>
  ${low.map(v=>`<p class="alert">Stock bas · ${e(name(v.sku))} · ${available(v.sku)} disponible(s)${data.offers.filter(o=>o.skus.includes(v.sku)).map(o=>' · '+e(o.title)).join('')}</p>`).join('')}
  <section>${table(['Bijou','Référence','Physique','Réservé','Disponible'],data.variants.map(v=>[`${v.photo?`<img class="thumb" alt="" src="${e(v.photo)}">`:''}${e(name(v.sku))}`,e(v.sku),v.physical,reserved(v.sku),available(v.sku)]),'Aucune référence enregistrée.')}</section>
  <h2>Nouvel arrivage</h2>
  <div class="arrival-layout">
   <form id="receipt-new">
    <h3>Nouveau modèle</h3>
    <div class="grid">
     <label>Référence<input name="sku" placeholder="Générée si vide"></label>
     ${required('Modèle','model','list="models"')}<datalist id="models">${[...new Set(data.variants.map(v=>v.model))].map(m=>`<option value="${e(m)}"></option>`).join('')}</datalist>
     <label>Variante (facultatif)<input name="variant" placeholder="Argenté"></label>
     ${required('Quantité','qty','type="number" min="1" step="1"')}${amount('Coût unitaire (MAD)','cost')}
    </div>
    <fieldset><legend>Photo</legend><div class="grid">
     <label>Choisir une photo<input name="photo" type="file" accept="image/*"></label>
     <label>Prendre une photo<input name="camera" type="file" accept="image/*" capture="environment"></label>
    </div></fieldset>
    <button class="primary">Ajouter à l’arrivage</button>
   </form>
   <form id="receipt-existing">
    <h3>Modèle existant</h3>
    ${data.variants.length?`<div class="grid">
     ${selectable('Modèle et variante','existing','<option value="">Sélectionner</option>'+options(data.variants.map(v=>[v.sku,name(v.sku)+' · '+v.sku])))}
     ${required('Quantité','qty','type="number" min="1" step="1"')}${amount('Coût unitaire (MAD)','cost')}
    </div><p><button class="primary">Ajouter à l’arrivage</button></p>`:'<p class="muted">Les modèles apparaîtront ici après validation de leur premier arrivage.</p>'}
   </form>
  </div>
  ${receipt.length?`<form id="receipt"><div class="grid">${required('Fournisseur','supplier')}${required('Date de réception','received','type="date" value="'+date().slice(0,10)+'"')}</div>
  ${table(['Référence','Quantité','Coût unitaire',''],receipt.map((r,i)=>[e(r.sku),r.qty,money(r.cost),button('Retirer','remove-receipt',i)]),'')}
  <p><button class="primary">Valider l’arrivage</button></p></form>`:''}
  <section><h2>Historique des arrivages</h2>${table(['Date','Fournisseur','Détail','Total'],data.receipts.map(r=>[e(r.received),e(r.supplier),r.lines.map(l=>`${e(l.sku)} × ${l.qty} à ${money(l.cost)}`).join('<br>'),money(r.lines.reduce((n,l)=>n+l.qty*l.cost,0))]),'Les arrivages validés apparaissent ici.')}</section>`;
}
const types = {unit:'À l’unité',fixed:'Trio fixe',custom:'Trio à composer'};
function offers(){
 return `<h1>Offres</h1><section>${table(['Offre','Format','Prix','Disponible','Site','Instagram'],data.offers.map(o=>[e(o.title),types[o.type],money(o.price),o.type==='custom'?'Selon la composition':Math.min(...Object.entries(needs(o.skus.map(sku=>({sku,qty:1})))).map(([sku,qty])=>Math.floor(available(sku)/qty))),button(o.site?'Mettre en pause':'Activer','toggle-site',o.id),button(o.instagram?'Mettre en pause':'Activer','toggle-instagram',o.id)]),'Aucune offre créée.')}</section>
 ${data.variants.length?`<form id="offer"><h2>Créer une offre</h2><div class="grid">${required('Nom','title')}${selectable('Format','type',options(Object.entries(types)))}${amount('Prix de vente','price')}</div>
 <p class="muted">Sélectionne une référence pour l’unité, ou les références du trio. Un trio fixe utilise les trois premières sélections, répétitions comprises.</p>
 <div class="grid">${[1,2,3].map(i=>selectable('Référence '+i,'sku','<option value="">Choisir</option>'+skuOptions())).join('')}</div>
 <p><label>Références supplémentaires pour le trio à composer<select name="extra" multiple size="4">${skuOptions()}</select></label></p>
 <div class="row"><label>Doublons dans un trio à composer<input type="checkbox" name="repeat"></label><label>Site<input type="checkbox" name="site" checked></label><label>Instagram<input type="checkbox" name="instagram" checked></label></div>
 <p><button class="primary">Créer l’offre</button></p></form>`:'<p>Réceptionne un arrivage pour créer ta première offre.</p>'}`;
}
const orderTotal=o=>o.lines.reduce((n,l)=>n+l.price*l.qty,0)+o.shipping;
function orderForm(){
 return `<h1>Commandes</h1><form id="order"><h2>${editing?'Reprendre le brouillon':'Nouvelle commande Instagram'}</h2>
 <div class="grid">${required('Nom','customer')}${required('Téléphone','phone','type="tel"')}${required('Ville','city')}${required('Adresse','address')}${amount('Livraison facturée','shipping','value="0"')}${selectable('Paiement','payment',options([['cod','À la livraison'],['online','En ligne']]))}</div>
 <div id="cart"></div><div class="grid">${selectable('Offre','offer','<option value="">Choisir une offre</option>'+options(data.offers.filter(o=>o.instagram).map(o=>[o.id,o.title])))}<label>Quantité<input name="qty" type="number" min="1" step="1" value="1"></label></div><div id="composition"></div>
 <p>${button('Ajouter l’offre','add-cart')}</p><div class="row"><button type="submit" value="draft" formnovalidate>Enregistrer en brouillon</button><button type="submit" value="confirm" class="primary">Confirmer la commande</button></div></form>
 <section>${table(['Cliente','Canal','Statut','Total',''],data.orders.map(o=>[e(o.customer||'Brouillon'),o.channel,e(o.status),money(orderTotal(o)),o.status==='Brouillon'?button('Reprendre','edit-order',o.id):'']),'Aucune commande.')}</section>`;
}
function drawCart(){
 document.querySelector('#cart').innerHTML=table(['Offre','Composition','Prix',''],cart.map((l,i)=>[`${e(l.title)} × ${l.qty}`,l.items.map(x=>`${e(name(x.sku))} × ${x.qty}`).join('<br>'),money(l.qty*l.price),button('Retirer','remove-cart',i)]),'Ajoute au moins une offre pour confirmer.');
}
function drawComposition(){
 const form=document.querySelector('#order');
 const o=data.offers.find(x=>x.id===form.elements.offer.value);
 document.querySelector('#composition').innerHTML=o?.type==='custom'?`<div class="grid">${[1,2,3].map(i=>selectable('Bijou '+i,'pick','<option value="">Choisir</option>'+options(o.skus.map(sku=>[sku,name(sku)+' · '+available(sku)+' disponible(s)'])))).join('')}</div>`:o?`<p>${o.skus.map(s=>e(name(s))).join(' + ')} · ${money(o.price)}</p>`:'';
}
function orderCard(o,body){
 return `<section><span class="pill">${e(o.channel)} · ${e(o.status)}</span><h2>${e(o.customer)} · ${money(orderTotal(o))}</h2><p>${e(o.city)} · ${e(o.address)} · ${e(o.phone)}</p>${body}</section>`;
}
function preparation(){
 return '<h1>Préparation</h1>'+ (data.orders.filter(o=>['À préparer','Préparée'].includes(o.status)).map(o=>orderCard(o,`<form data-order="${o.id}" data-kind="${o.status==='À préparer'?'prepare':'ship'}">${o.status==='À préparer'?`${Object.entries(needs(o.lines.flatMap(l=>l.items))).map(([sku,qty])=>`<label class="line"><span><input style="width:auto" type="checkbox" required> ${e(name(sku))} × ${qty}</span></label>`).join('')}<p><button class="primary">Marquer comme préparée</button></p>`:`<div class="grid">${required('Transporteur','carrier')}<label>Numéro de suivi<input name="tracking"></label>${amount('Coût réel du transport','transport')}</div><p><button class="primary">Expédier</button></p>`}</form>${button('Annuler la commande','cancel',o.id)}`)).join('')||'<p>Aucun colis à préparer.</p>');
}
function tracking(){
 return '<h1>Suivi</h1>'+(['Livraison en cours','Livrée','Payée','Retour'].map(status=>`<h2>${status}</h2>`+(data.orders.filter(o=>o.status===status).map(o=>orderCard(o,`<p>${e(o.carrier)} ${e(o.tracking)} · ${o.payment==='cod'?'Paiement à la livraison':'Paiement en ligne'}${o.received!=null?' · Encaissé '+money(o.received):''}</p>
 ${status==='Livraison en cours'?button('Marquer livrée','delivered',o.id,true):''}
 ${(['Livraison en cours','Livrée','Payée'].includes(status))?button('Signaler un retour','return',o.id):''}
 ${status==='Livrée'?`<form data-order="${o.id}" data-kind="payment"><div class="grid">${amount('Montant reçu','received','value="'+orderTotal(o)/100+'"')}<label>Référence du versement<input name="reference"></label></div><p><button class="primary">Enregistrer le versement</button></p></form>`:''}
 ${status==='Retour'&&!o.returnClosed?`<form data-order="${o.id}" data-kind="restock"><p>Après réception et contrôle, indique les pièces revendables.</p><div class="grid">${Object.entries(needs(o.lines.flatMap(l=>l.items))).map(([sku,qty])=>required(e(name(sku)),e(sku),`type="number" min="0" max="${qty}" step="1" value="${qty}"`)).join('')}${amount('Frais de retour','returnFee','value="0"')}</div><p><button class="primary">Valider le retour reçu</button></p></form>`:''}
 ${o.returnClosed?'<p>Retour traité</p>':''}`)).join('')||'<p class="muted">Aucune commande.</p>')).join(''));
}
function dashboard(){
 const shipped=data.orders.filter(o=>['Livraison en cours','Livrée','Payée','Retour'].includes(o.status));
 const sales=shipped.filter(o=>['Livrée','Payée'].includes(o.status));
 const paid=data.orders.filter(o=>o.received!=null);
 return `<h1>Pilotage</h1><div class="grid"><section><p>Ventes livrées</p><h2>${money(sales.reduce((s,o)=>s+orderTotal(o),0))}</h2></section><section><p>Versements enregistrés</p><h2>${money(paid.reduce((s,o)=>s+o.received,0))}</h2></section><section><p>Montants à recevoir sur livrées</p><h2>${money(sales.reduce((s,o)=>s+Math.max(0,orderTotal(o)-(o.received||0)),0))}</h2></section></div><section>${table(['Canal','Livrées','Ventes livrées','Transport et retours'],['Instagram','Site'].map(channel=>{const rows=sales.filter(o=>o.channel===channel);return [channel,rows.length,money(rows.reduce((s,o)=>s+orderTotal(o),0)),money(shipped.filter(o=>o.channel===channel).reduce((s,o)=>s+(o.transport||0)+(o.returnFee||0),0))];}),'')}</section>`;
}
function render(){
 nav.innerHTML=pages.map(p=>`<button data-action="nav" data-value="${p}" class="${p===page?'active':''}">${p}</button>`).join('');
 view.innerHTML=({Stock:stock,Offres:offers,Commandes:orderForm,Préparation:preparation,Suivi:tracking,Pilotage:dashboard})[page]();
 if(page==='Commandes'){
  const draft=data.orders.find(o=>o.id===editing);
  if(draft) for(const field of ['customer','phone','city','address','shipping','payment']) document.querySelector('#order').elements[field].value=field==='shipping'?draft.shipping/100:draft[field];
  drawCart();
 }
}
function image(file){
 if(!file?.size)return Promise.resolve('');
 if(!file.type.startsWith('image/'))throw Error('Choisis un fichier image.');
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file);
  const photo=new Image();
  photo.onload=()=>{
   URL.revokeObjectURL(url);
   const scale=Math.min(1,960/Math.max(photo.width,photo.height));
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(photo.width*scale));
   canvas.height=Math.max(1,Math.round(photo.height*scale));
   const ctx=canvas.getContext('2d');
   ctx.fillStyle='#fff';
   ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(photo,0,0,canvas.width,canvas.height);
   resolve(canvas.toDataURL('image/jpeg',0.8));
  };
  photo.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Format illisible. Essaie une photo JPEG ou PNG.'));};
  photo.src=url;
 });
}
function checkStock(lines){
 for(const [sku,qty] of Object.entries(needs(lines.flatMap(l=>l.items)))) if(qty>available(sku))throw Error(`Stock insuffisant · ${name(sku)} · ${qty} demandé(s), ${available(sku)} disponible(s).`);
}
document.addEventListener('change',event=>{if(event.target.matches('#order [name=offer]'))drawComposition();});
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target)return;
 const {action,value}=target.dataset;
 try{
  if(action==='nav'){page=value;message('');render();}
  if(action==='remove-receipt'){receipt.splice(Number(value),1);render();}
  if(action==='remove-cart'){cart.splice(Number(value),1);drawCart();}
  if(action==='edit-order'){editing=value;cart=structuredClone(data.orders.find(o=>o.id===value).lines);render();}
  if(action==='add-cart'){
   const f=new FormData(document.querySelector('#order'));
   const o=data.offers.find(item=>item.id===f.get('offer')&&item.instagram);
   const qty=Number(f.get('qty'));
   if(!o||!Number.isSafeInteger(qty)||qty<1)throw Error('Choisis une offre et une quantité entière.');
   const picks=o.type==='custom'?f.getAll('pick'):o.skus;
   if(picks.some(sku=>!o.skus.includes(sku))||(o.type==='custom'&&(picks.length!==3||(!o.repeat&&new Set(picks).size!==3))))throw Error('Choisis trois bijoux selon les règles du trio.');
   cart.push({title:o.title,qty,price:o.price,items:picks.map(sku=>({sku,qty}))});drawCart();message('');
  }
  if(action.startsWith('toggle-')){
   const o=data.offers.find(x=>x.id===value);const field=action.slice(7);
   save(()=>{o[field]=!o[field];},'Canal mis à jour.');
  }
  if(['cancel','delivered','return'].includes(action)){
   const o=data.orders.find(x=>x.id===value);
   if(action==='cancel'&&!window.confirm('Annuler cette commande et libérer ses pièces ?'))return;
   save(()=>{o.status={cancel:'Annulée',delivered:'Livrée',return:'Retour'}[action];},'Commande mise à jour.');
  }
 }catch(error){message(error.message,true);}
});
document.addEventListener('submit',async event=>{
 event.preventDefault();
 const form=event.target;
 const f=new FormData(form);
 try{
  if(['receipt-new','receipt-existing'].includes(form.id)){
   const existing=bySku(f.get('existing'));
   if(form.id==='receipt-existing'&&!existing)throw Error('Sélectionne un modèle et sa variante.');
   const model=existing?.model??f.get('model').trim();
   const variant=existing?.variant??f.get('variant').trim();
   if(!model)throw Error('Indique le nom du modèle.');
   const same=data.variants.find(v=>v.model.toLowerCase()===model.toLowerCase()&&v.variant.toLowerCase()===variant.toLowerCase());
   if(same&&!existing)throw Error('Cette référence existe déjà. Utilise Modèle existant pour la réapprovisionner.');
   const sku=existing?.sku||(f.get('sku').trim()||[model,variant].filter(Boolean).join('-')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9-]+/g,'-');
   if(!sku||(!existing&&!same&&bySku(sku))||receipt.some(r=>r.sku===sku))throw Error('Référence déjà utilisée ou déjà présente dans cet arrivage.');
   const photo=existing ? existing.photo : await image(f.get('camera')?.size ? f.get('camera') : f.get('photo'));
   if(receipt.some(r=>r.sku===sku))throw Error('Référence déjà présente dans cet arrivage.');
   receipt.push({sku,model,variant,qty:Number(f.get('qty')),cost:cents(f.get('cost')),photo});
   render();message('Ligne ajoutée à l’arrivage.');
  }
  if(form.id==='receipt'){
   const lines=receipt.map(({sku,qty,cost})=>({sku,qty,cost}));
   const pending=receipt;
   receipt=[];
   try{save(()=>{
    for(const row of pending){
     const v=bySku(row.sku);
     if(v)v.physical+=row.qty;
     else data.variants.push({sku:row.sku,model:row.model,variant:row.variant,photo:row.photo,physical:row.qty});
    }
    data.receipts.push({supplier:f.get('supplier'),received:f.get('received'),lines});
   },'Arrivage validé.');}catch(error){receipt=pending;throw error;}
  }
  if(form.id==='offer'){
   const type=f.get('type');
   const selected=f.getAll('sku').filter(Boolean);
   const skus=type==='custom'?[...new Set([...selected,...f.getAll('extra')])]:selected;
   if((type==='unit'&&skus.length!==1)||(type==='fixed'&&skus.length!==3)||(type==='custom'&&skus.length<(f.has('repeat')?1:3)))throw Error('Nombre de références incompatible avec le format.');
   save(()=>{data.offers.push({id:id(),type,skus,title:f.get('title'),price:cents(f.get('price')),site:f.has('site'),instagram:f.has('instagram'),repeat:f.has('repeat')});},'Offre créée.');
  }
  if(form.id==='order'){
   const confirm=event.submitter?.value==='confirm';
   if(confirm){if(!cart.length)throw Error('Ajoute une offre.');checkStock(cart);}
   const o={id:editing||id(),channel:'Instagram',status:confirm?'À préparer':'Brouillon',lines:cart,shipping:cents(f.get('shipping')),customer:f.get('customer'),city:f.get('city'),phone:f.get('phone'),address:f.get('address'),payment:f.get('payment')};
   const previousCart=cart, previousEditing=editing;
   cart=[];editing=null;
   try{save(()=>{data.orders=data.orders.filter(x=>x.id!==o.id);data.orders.push(o);},confirm?'Commande confirmée et pièces réservées.':'Brouillon enregistré.');}
   catch(error){cart=previousCart;editing=previousEditing;throw error;}
  }
  if(form.dataset.order){
   const o=data.orders.find(x=>x.id===form.dataset.order);
   save(()=>{
    switch(form.dataset.kind){
     case 'prepare': o.status='Préparée'; break;
     case 'ship':
      for(const [sku,qty] of Object.entries(needs(o.lines.flatMap(l=>l.items))))bySku(sku).physical-=qty;
      Object.assign(o,{status:'Livraison en cours',carrier:f.get('carrier'),tracking:f.get('tracking'),transport:cents(f.get('transport'))});break;
     case 'payment':{
      const received=cents(f.get('received'));
      Object.assign(o,{status:received>=orderTotal(o)?'Payée':'Livrée',received,reference:f.get('reference'),paidAt:date()});break;
     }
     case 'restock':
      for(const sku of Object.keys(needs(o.lines.flatMap(l=>l.items))))bySku(sku).physical+=Number(f.get(sku));
      Object.assign(o,{returnClosed:true,returnFee:cents(f.get('returnFee'))});break;
    }
   },'Commande mise à jour.');
  }
 }catch(error){message(error.message,true);}
});
render();
</script>
</html>
